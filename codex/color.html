<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RGB 颜色工具</title>
  <link rel="stylesheet" href="assets/css/shared.css">
  <link rel="stylesheet" href="assets/css/color.css">
</head>
<body>
  <main class="page color-page">
    <header class="topbar">
      <div class="brand">
        <h1>RGB 颜色工具</h1>
        <p>浏览 RGB 色块、HEX 值和 Pantone 近似色，快速查找界面用色。</p>
      </div>
      <nav class="nav" aria-label="页面导航">
        <a href="tools.html">工具集</a>
        <a href="#palette">RGB 色块</a>
        <a href="index.html">Icon 工具</a>
      </nav>
    </header>

    <div class="content">
      <section class="main" aria-label="颜色列表">
        <div class="section-title">
          <h2 id="palette">RGB 色块</h2>
          <span id="rangeLabel">4,096 个色块</span>
        </div>

        <div class="summary">
          <div class="summary-card">
            <b id="totalCount">4,096</b>
            <span>一次性展示色块数</span>
          </div>
          <div class="summary-card">
            <b id="stepInfo">32</b>
            <span>通道档位</span>
          </div>
          <div class="summary-card">
            <b id="visibleRange">#000000 - #FFFFFF</b>
            <span>HEX 范围</span>
          </div>
        </div>

        <div class="palette" id="colorGrid"></div>

        <div class="section-title secondary-title">
          <h2>Pantone 近似色标注</h2>
          <span>Pantone 参考色</span>
        </div>
        <div class="pantone-strip" id="pantoneStrip"></div>
      </section>

      <aside class="ad-space" aria-label="侧栏区域">
        <div class="ad-line"></div>
      </aside>
    </div>
  </main>

  <script src="assets/js/color.js"></script>
</body>
</html>
