<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Icon browser smoke test</title>
</head>
<body data-result="PENDING">
  <iframe id="app" title="Icon generator" hidden></iframe>
  <script>
    function waitFor(predicate, message) {
      return new Promise((resolve, reject) => {
        let attempts = 0;
        const check = () => {
          if (predicate()) {
            resolve();
          } else if (attempts >= 1800) {
            reject(new Error(message));
          } else {
            attempts += 1;
            setTimeout(check, 16);
          }
        };
        check();
      });
    }

    document.getElementById('app').addEventListener('load', async (event) => {
      try {
        document.body.dataset.step = 'app-loaded';
        const app = event.currentTarget.contentWindow;
        const iconCore = app.IconCore;
        if (!iconCore) {
          throw new Error('inline IconCore unavailable');
        }
        if (app.document.querySelector('link[rel="stylesheet"], script[src]')) {
          throw new Error('index.html is not self-contained');
        }
        const downloadButtons = Array.from(app.document.querySelectorAll('button[id^="download"]'));
        if (downloadButtons.length !== 1
          || downloadButtons[0].id !== 'downloadZip'
          || !downloadButtons[0].textContent.includes('统一 ZIP')) {
          throw new Error('the page must expose exactly one unified ZIP download button');
        }

        const backgroundSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024"><rect width="1024" height="1024" fill="#0a84ff"/></svg>';
        const middleSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024"><rect width="1024" height="1024" fill="#ff3b30"/></svg>';
        const foregroundSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024"><circle cx="512" cy="512" r="260" fill="white"/></svg>';
        app.loadLayerFile('default', 'background', new app.File([backgroundSvg], 'background.svg', { type: 'image/svg+xml' }));
        app.loadLayerFile('default', 'foreground', new app.File([foregroundSvg], 'foreground.svg', { type: 'image/svg+xml' }));
        await waitFor(
          () => downloadButtons.every((button) => !button.disabled),
          'required layers did not enable the unified ZIP export'
        );
        document.body.dataset.step = 'layers-ready';

        const layerScaleInput = (layer) => app.document.querySelector(`.layer-scale-input[data-layer="${layer}"]`);
        const layerScaleNumber = (layer) => app.document.querySelector(`.layer-scale-number[data-layer="${layer}"]`);
        const setNumber = (input, value) => {
          input.value = value;
          input.dispatchEvent(new app.Event('change', { bubbles: true }));
        };
        if (!layerScaleInput('middle').disabled) {
          throw new Error('missing optional middle layer scale should be disabled');
        }
        if (!layerScaleNumber('middle').disabled) {
          throw new Error('missing optional middle layer number should be disabled');
        }

        app.loadLayerFile('default', 'middle', new app.File([middleSvg], 'middle.svg', { type: 'image/svg+xml' }));
        await waitFor(() => !layerScaleInput('middle').disabled, 'middle layer scale did not enable');
        setNumber(layerScaleNumber('background'), 60);
        setNumber(layerScaleNumber('middle'), 50);
        setNumber(layerScaleNumber('foreground'), 40);
        if (layerScaleInput('background').value !== '60'
          || layerScaleInput('middle').value !== '50'
          || layerScaleInput('foreground').value !== '40') {
          throw new Error('numeric layer scales did not synchronize sliders');
        }

        const separatedPreview = app.renderIcon();
        const separatedContext = separatedPreview.getContext('2d');
        const pixelAt = (x, y) => Array.from(separatedContext.getImageData(x, y, 1, 1).data);
        if (pixelAt(10, 10).slice(0, 3).join(',') !== '245,245,247') {
          throw new Error('background layer did not scale independently');
        }
        if (pixelAt(700, 700).slice(0, 3).join(',') !== '255,59,48') {
          throw new Error('middle layer did not scale independently');
        }
        if (pixelAt(512, 512).slice(0, 3).join(',') !== '255,255,255') {
          throw new Error('foreground layer did not scale independently');
        }
        if (pixelAt(700, 512).slice(0, 3).join(',') !== '255,59,48') {
          throw new Error('foreground layer scale affected another layer');
        }

        const overallScale = app.document.getElementById('scale');
        const overallScaleNumber = app.document.getElementById('scaleNumber');
        setNumber(overallScaleNumber, 120);
        if (overallScale.value !== '120') {
          throw new Error('numeric overall scale did not synchronize slider');
        }
        const overallPreview = app.renderIcon();
        const overallPixel = Array.from(overallPreview.getContext('2d').getImageData(800, 512, 1, 1).data);
        if (overallPixel.slice(0, 3).join(',') !== '255,59,48') {
          throw new Error('overall scale no longer affects the combined icon');
        }

        setNumber(layerScaleNumber('background'), 100);
        setNumber(layerScaleNumber('middle'), 108);
        setNumber(layerScaleNumber('foreground'), 88);
        app.document.querySelector('[data-platform="tvos"]').click();
        if (layerScaleNumber('background').value !== '100'
          || layerScaleNumber('middle').value !== '108'
          || layerScaleNumber('foreground').value !== '88'
          || overallScaleNumber.value !== '100') {
          throw new Error('tvOS did not receive synchronized layer scales');
        }
        const tvPreview = app.renderIcon();
        const tvContext = tvPreview.getContext('2d');
        const tvOuterPixel = Array.from(tvContext.getImageData(130, 240, 1, 1).data);
        const tvMiddlePixel = Array.from(tvContext.getImageData(150, 240, 1, 1).data);
        if (tvOuterPixel.slice(0, 3).join(',') !== '10,132,255'
          || tvMiddlePixel.slice(0, 3).join(',') !== '255,59,48') {
          throw new Error('tvOS content layers were not adapted to the platform short edge');
        }
        app.document.querySelector('[data-platform="watchos"]').click();
        if (layerScaleNumber('background').value !== '100'
          || layerScaleNumber('middle').value !== '108'
          || layerScaleNumber('foreground').value !== '88'
          || overallScaleNumber.value !== '100') {
          throw new Error('watchOS did not receive synchronized layer scales');
        }
        const watchPreview = app.renderIcon();
        const watchPixel = Array.from(watchPreview.getContext('2d').getImageData(544, 544, 1, 1).data);
        if (watchPixel.slice(0, 3).join(',') !== '255,255,255') {
          throw new Error('watchOS render did not preserve synchronized foreground scale');
        }

        const defaultManifest = app.compositionManifest();
        if (defaultManifest.formatVersion !== 4
          || defaultManifest.layerScaleBehavior.synchronizedAcrossPlatforms !== true
          || defaultManifest.layerScaleBehavior.middleAndForegroundFit !== 'contain'
          || defaultManifest.releaseVariants.length !== 10
          || defaultManifest.modes.default.layers.background.scalePercent !== 100
          || defaultManifest.modes.default.layers.middle.scalePercent !== 108
          || defaultManifest.modes.default.layers.foreground.scalePercent !== 88) {
          throw new Error('layer scales are missing from composition manifest');
        }

        app.document.querySelector('[data-platform="ios"]').click();
        app.document.querySelector('[data-mode="dark"]').click();
        const inheritedCard = app.document.querySelector('[data-card-mode="dark"][data-card-layer="background"]');
        if (!inheritedCard.classList.contains('inherited') || !inheritedCard.textContent.includes('继承 Default')) {
          throw new Error('Dark mode did not inherit Default layers');
        }
        if (layerScaleNumber('foreground').value !== '100' || overallScaleNumber.value !== '100') {
          throw new Error('Dark mode scale state leaked from Default mode');
        }
        setNumber(layerScaleNumber('foreground'), 80);
        app.document.querySelector('[data-platform="tvos"]').click();
        if (layerScaleNumber('foreground').value !== '80') {
          throw new Error('Dark layer scale did not synchronize across platforms');
        }
        app.document.querySelector('[data-platform="ios"]').click();
        app.document.querySelector('[data-mode="default"]').click();
        if (layerScaleNumber('foreground').value !== '88') {
          throw new Error('Default layer scale was changed by Dark mode');
        }
        app.document.querySelector('[data-mode="dark"]').click();
        if (layerScaleNumber('foreground').value !== '80') {
          throw new Error('Dark layer scale was not preserved');
        }

        const preview = app.renderIcon();
        const previewBlob = await app.canvasToBlob(preview);
        const previewBytes = new app.Uint8Array(await previewBlob.arrayBuffer());
        if (iconCore.pngUsesTransparency(previewBytes)) {
          throw new Error('PNG contains transparency');
        }

        const maskedPreview = app.renderMaskedPreview();
        const maskedBlob = await app.canvasToBlob(maskedPreview, { allowTransparency: true });
        const maskedBytes = new app.Uint8Array(await maskedBlob.arrayBuffer());
        if (!iconCore.pngUsesTransparency(maskedBytes)) {
          throw new Error('masked preview PNG does not contain transparent corners');
        }

        app.document.querySelector('[data-mode="default"]').click();
        const platform = app.currentPlatform();
        const preparedBackground = app.renderPreparedLayer({ mode: 'default', platform, layer: 'background' });
        const preparedMiddle = app.renderPreparedLayer({ mode: 'default', platform, layer: 'middle' });
        const preparedForeground = app.renderPreparedLayer({ mode: 'default', platform, layer: 'foreground' });
        const reconstructed = app.document.createElement('canvas');
        reconstructed.width = platform.width;
        reconstructed.height = platform.height;
        const reconstructedContext = reconstructed.getContext('2d');
        reconstructedContext.drawImage(preparedBackground, 0, 0);
        reconstructedContext.drawImage(preparedMiddle, 0, 0);
        reconstructedContext.drawImage(preparedForeground, 0, 0);
        const releasePreview = app.renderIcon({ mode: 'default', platform });
        const releaseContext = releasePreview.getContext('2d');
        [[10, 10], [512, 512], [700, 512]].forEach(([x, y]) => {
          const actual = Array.from(reconstructedContext.getImageData(x, y, 1, 1).data);
          const expected = Array.from(releaseContext.getImageData(x, y, 1, 1).data);
          if (actual.join(',') !== expected.join(',')) {
            throw new Error('prepared release layers do not reconstruct the final icon');
          }
        });

        const releaseAssets = await app.releaseEntries();
        const releasePaths = releaseAssets.map((entry) => entry.path);
        if (releaseAssets.length !== 60 || new Set(releasePaths).size !== 60) {
          throw new Error('Release must contain 60 unique final PNG icons');
        }

        const releaseCounts = new Map();
        for (const entry of releaseAssets) {
          const match = entry.path.match(/^Release\/(iOS|tvOS|watchOS)\/AppIcon-(Default|Dark)-(16|32|128|256|512)pt@(1|2)x\.png$/);
          if (!match) {
            throw new Error(`Release contains a non-icon path: ${entry.path}`);
          }
          const [, platformName, modeName, pointSize, scale] = match;
          const bytes = new app.Uint8Array(await entry.blob.arrayBuffer());
          const view = new app.DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
          const expectedPixelSize = Number(pointSize) * Number(scale);
          if (view.getUint32(16) !== expectedPixelSize || view.getUint32(20) !== expectedPixelSize) {
            throw new Error(`${entry.path} has incorrect PNG dimensions`);
          }
          if (iconCore.pngUsesTransparency(bytes)) {
            throw new Error(`${entry.path} is not an opaque PNG`);
          }
          const countKey = `${platformName}-${modeName}`;
          releaseCounts.set(countKey, (releaseCounts.get(countKey) || 0) + 1);
        }
        ['iOS', 'tvOS', 'watchOS'].forEach((platformName) => {
          ['Default', 'Dark'].forEach((modeName) => {
            if (releaseCounts.get(`${platformName}-${modeName}`) !== 10) {
              throw new Error(`${platformName} ${modeName} does not contain 10 final icons`);
            }
          });
        });

        const downloads = [];
        app.downloadBlob = (blob, filename) => {
          downloads.push({ blob, filename });
        };
        app.document.getElementById('downloadZip').click();
        await waitFor(() => downloads.length === 1, 'unified ZIP download was not produced');
        document.body.dataset.step = 'zip-created';
        if (!downloads[0].filename.endsWith('-apple-icon.zip')) {
          throw new Error('unified ZIP filename is incorrect');
        }
        const zipText = new TextDecoder().decode(new Uint8Array(await downloads[0].blob.arrayBuffer()));
        [
          ...releasePaths,
          'Release/iOS/AppIcon-Default-16pt@1x.png',
          'Release/iOS/AppIcon-Dark-512pt@2x.png',
          'Release/tvOS/AppIcon-Default-128pt@2x.png',
          'Release/watchOS/AppIcon-Dark-256pt@1x.png',
          'Source/Original/Default/01-background.svg',
          'Source/Original/Default/02-middle.svg',
          'Source/Original/Dark/03-foreground.svg',
          'Preview/Masked/iOS/AppIcon-Default-Masked-1024x1024.png',
          'Preview/Masked/watchOS/AppIcon-Dark-Masked-1088x1088.png',
          'Docs/composition.json',
          'Docs/README.txt',
          'Docs/DIRECTORY-GUIDE.md'
        ].forEach((path) => {
          if (!zipText.includes(path)) {
            throw new Error(`unified ZIP is missing ${path}`);
          }
        });
        [
          'Release/PNG/',
          'Release/Layers/',
          'Release/Xcode/',
          'Release/README.txt',
          'Release/iOS-macOS/',
          'Release/iOS/AppIcon.appiconset/',
          'Release/iOS/Contents.json'
        ].forEach((path) => {
          if (zipText.includes(path)) {
            throw new Error(`unified ZIP contains legacy release path ${path}`);
          }
        });

        window.testZipBlob = downloads[0].blob;
        document.body.dataset.result = 'PASS';
        document.body.textContent = '60 Release icons and unified ZIP export flow passed';
      } catch (error) {
        document.body.dataset.result = 'FAIL';
        document.body.textContent = error.message;
      }
    });
    document.getElementById('app').src = '../index.html';
  </script>
</body>
</html>
